<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>
  <main>
    <div class="card">
      <img class="course-image" src="assets\images\illustration-article.svg" alt="HTML & CSS foundations card image">

      <div class="content">
        <p>Learning</p>
        <p>Published 21 Dec 2023</p>
        <p class="pointer">HTML & CSS foundations</p>
        <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      
      <div class="creator">
        <img src="assets\images\image-avatar.webp" alt="Creator avatar image">

        <p>Greg Hooper</p>
      </div>
    </div>

  </main>
</body>
</html>
